<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Table</title>
</head>
<body>
    <h1>Data Table</h1>
    <input type="text" id="searchBox" placeholder="Search by name or city...">
    <button id="sortNameBtn">Sort by Name</button>
    <button id="sortAgeBtn">Sort by Age</button>
    <table border="1" style="margin-top: 20px; width: 100%;">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
    <script src="JS/data.js"></script>
</body>
</html>
